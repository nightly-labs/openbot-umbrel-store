version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: openbot-server_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.77.0@sha256:4db3793f25d42c1163369cfbf497481ea52a735ff0f9bd9b5b751119a8b68d8f
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
