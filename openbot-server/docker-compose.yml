version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: openbot-server_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.76.0@sha256:1bd110549b5a90a9de2b4be3251c0c7686cd73fbee2b9ab9464ab330fce8f1b8
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
