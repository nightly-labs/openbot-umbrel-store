version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: openbot-server_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.81.0@sha256:1425ea2b09124f5581cba76be7c123a31edb71545ce6de53676283bfbf6bbc86
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
