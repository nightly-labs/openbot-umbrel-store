version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: openbot-server_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.76.1@sha256:5ec0984cf1eaa9b9b81bf19d05315b0696bdfbb08bad6240ebfed9a85355f9d2
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
