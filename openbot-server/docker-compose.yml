version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: openbot-server_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.78.0@sha256:84db68066c8d51235a950e505ce6009cebf03e795e6207fac87effbdeada0953
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
